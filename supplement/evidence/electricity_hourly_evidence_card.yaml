supported_claims:
- The adaptive controller achieved the registered 70 percent Ridge-coverage constraint
  on Electricity Hourly.
- Adaptive control reduced the static router's absolute coverage violation from about
  1.4382 to 0.0038 percentage points; both methods were inside the registered two-percentage-point
  tolerance.
- The adaptive full router had lower RMSSE than seasonal naive, with aligned Holm-Wilcoxon
  and paired-bootstrap support.
- At the registered 1 percent margin, both inferential criteria supported noninferiority
  to Ridge-only, residual-features-only, class-weight-only, hard-logistic, static-full-router,
  and soft-targets-only.
- Aligned inference favored the random-forest router, AALF-like router, static full
  router, class-weight-only, and hard-logistic router over the adaptive full router.
- Relative to the static full router, adaptive control moved coverage much closer
  to the target but increased mean RMSSE by about 0.38 percent, demonstrating an accuracy-coverage
  trade-off.
unsupported_claims:
- The proposed method was the most accurate method on Electricity Hourly.
- The proposed method outperformed the random-forest router, the AALF-like router,
  the static full router, class-weight-only, or the hard-logistic router.
- The proposed method was directionally superior to LightGBM-only, residual-features-only,
  Ridge-only, equal-weight averaging, or soft-targets-only; the registered rank and
  mean-bootstrap rules were discordant or inconclusive for these comparisons.
- The random-forest or static full router failed the registered coverage tolerance;
  both satisfied the two-percentage-point rule.
- Coverage-constrained or unconstrained oracle results represent deployable forecasting
  methods.
required_reporting:
- Report rank 10 of 14, mean RMSSE 0.583202, Ridge coverage 0.700038, absolute coverage
  deviation 0.000038, and the passed coverage constraint.
- Report that the random-forest router ranked 3 with mean RMSSE 0.558159, Ridge coverage
  0.701246, passed the coverage tolerance, and was supported as more accurate than
  the adaptive method.
- Report that the static full router had mean RMSSE 0.580976 and Ridge coverage 0.714382;
  it also passed the tolerance and was supported as more accurate than adaptive control.
- Report that AALF-like ranked 4 with mean RMSSE 0.578538 and Ridge coverage 0.696366,
  and was supported as more accurate.
- Report the rank-versus-mean-bootstrap discordance or uncertainty for equal-weight
  averaging, soft-targets-only, Ridge-only, LightGBM-only, and residual-features-only.
- Present oracle methods as post-hoc diagnostic lower bounds only.
- Do not rerun, retune, or exclude Electricity Hourly after observing the formal test.
