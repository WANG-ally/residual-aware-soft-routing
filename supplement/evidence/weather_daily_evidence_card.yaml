supported_claims:
- The adaptive controller achieved the registered 70 percent Ridge-coverage constraint
  on the fixed Weather Daily sample.
- Adaptive control reduced the static router's absolute coverage deviation from about
  0.3253 to 0.0042 percentage points; both were inside the registered two-percentage-point
  tolerance.
- Aligned Holm-Wilcoxon and paired-bootstrap inference supported lower RMSSE than
  seasonal naive and Ridge-only.
- At the registered 1 percent margin, both inferential criteria supported noninferiority
  to Ridge-only, soft-targets-only, static-full-router, class-weight-only, hard-logistic,
  and AALF-like routing.
- Aligned inference favored LightGBM-only, the random-forest router, static routing,
  equal-weight averaging, residual-only routing, and soft-target routing over adaptive
  routing in RMSSE.
- Relative to the static router, adaptive control moved coverage closer to target
  while increasing mean RMSSE by about 0.29 percent.
unsupported_claims:
- The proposed method was the most accurate method on Weather Daily.
- The proposed method outperformed LightGBM-only, the random-forest router, the static
  router, equal-weight averaging, residual-only routing, or soft-target routing.
- The proposed method was directionally superior to class-weight-only or hard-logistic
  routing; the registered rank and mean-bootstrap rules were discordant or inconclusive.
- The random-forest, static, AALF-like, or residual-only router failed the registered
  coverage tolerance; all satisfied the two-point rule.
- The 500 registered Weather series represent a performance-selected sample.
- Coverage-constrained or unconstrained oracle results represent deployable forecasting
  methods.
required_reporting:
- Report rank 10 of 14, mean RMSSE 0.691972, Ridge coverage 0.700042, absolute coverage
  deviation 0.000042, and the passed coverage constraint.
- Report that LightGBM-only ranked 3 with mean RMSSE 0.674318 and was supported as
  more accurate, while having zero Ridge coverage.
- Report that the random-forest router ranked 4 with mean RMSSE 0.679320, Ridge coverage
  0.699023, passed the tolerance, and was supported as more accurate than adaptive
  routing.
- Report that the static router had mean RMSSE 0.689946 and Ridge coverage 0.696747;
  it passed the tolerance and was supported as more accurate than adaptive control.
- Report inference discordance or uncertainty for class-weight-only and hard-logistic
  routing.
- Present oracle methods as post-hoc diagnostic lower bounds only.
- State that the Weather archive was reduced to a fixed, type-stratified 500-series
  sample before performance analysis.
- Do not rerun, retune, replace sampled series, or exclude Weather Daily after observing
  the formal test.
