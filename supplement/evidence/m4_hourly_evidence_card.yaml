supported_claims:
- The adaptive controller achieved the registered 70 percent Ridge-coverage constraint
  on M4 Hourly.
- Adaptive control reduced the static router's absolute coverage violation from 4.6508
  to 1.8746 percentage points, bringing the adaptive method inside the registered
  tolerance.
- The adaptive full router had lower mean RMSSE than LightGBM-only and soft-targets-only,
  with aligned Holm-Wilcoxon and paired-bootstrap support.
- At the registered 1 percent margin, both inferential criteria supported noninferiority
  only to LightGBM-only and soft-targets-only among the registered non-oracle comparators.
- Relative to the static full router, adaptive control improved coverage compliance
  but increased mean RMSSE by about 2.51 percent, demonstrating an accuracy-coverage
  trade-off.
unsupported_claims:
- The proposed method was the most accurate method on M4 Hourly.
- The proposed method outperformed Ridge, equal-weight averaging, the random-forest
  router, the AALF-like router, or the static full router.
- The proposed method was noninferior to Ridge, equal-weight averaging, the random-forest
  router, or the static full router at the registered 1 percent margin.
- The adaptive method was directionally superior to seasonal naive; its Holm-Wilcoxon
  and mean-bootstrap conclusions were discordant, so no directional claim is supported.
- Coverage-constrained or unconstrained oracle results represent deployable forecasting
  methods.
required_reporting:
- Report rank 12 of 14, mean RMSSE 1.082009, Ridge coverage 0.718746, absolute coverage
  deviation 0.018746, and the passed coverage constraint.
- Report that the random-forest router ranked 3 with mean RMSSE 0.692883 but failed
  the coverage tolerance with deviation 0.034082.
- Report that the static full router had lower mean RMSSE 1.055503 but failed the
  coverage tolerance, whereas adaptive control passed it at an accuracy cost.
- Report the seasonal-naive discordance between the Holm-Wilcoxon rank result and
  the bootstrap interval for the mean difference.
- Present oracle methods as post-hoc diagnostic lower bounds only.
- Do not rerun, retune, or exclude M4 Hourly after observing the formal test.
