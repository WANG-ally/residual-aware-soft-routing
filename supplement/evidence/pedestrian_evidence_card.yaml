supported_claims:
- The adaptive controller achieved the registered 70 percent Ridge-coverage constraint
  on Pedestrian.
- Adaptive control reduced the static router's absolute coverage violation from about
  2.34 percent to about 0.14 percent.
- The adaptive full router was noninferior to LightGBM and the static full router
  under the preregistered 1 percent margin, with both Holm-Wilcoxon and bootstrap
  support.
- The adaptive full router significantly improved on Ridge, seasonal naive, and several
  registered ablations under the Holm-adjusted paired Wilcoxon analysis.
unsupported_claims:
- The proposed method was the most accurate method on Pedestrian.
- The proposed method significantly outperformed LightGBM, equal-weight averaging,
  or the random-forest router.
- The proposed method was noninferior to equal-weight averaging or the random-forest
  router at the 1 percent margin.
- Adaptive control significantly improved Pedestrian RMSSE over the static router.
- Coverage-constrained or unconstrained oracle results represent deployable forecasting
  methods.
required_reporting:
- Report rank 5 of 14, mean RMSSE 0.398511, Ridge coverage 0.701375, and the passed
  coverage constraint.
- Report the random-forest router's lower mean RMSSE and rank 3, while also reporting
  the nonsignificant Holm-adjusted comparison.
- Report that the advantage over LightGBM was only about 0.024 percent and was not
  statistically significant.
- Present oracle methods as post-hoc diagnostic lower bounds only.
- Do not rerun, retune, or exclude Pedestrian after observing the formal test.
