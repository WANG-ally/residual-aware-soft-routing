supported_claims:
- The adaptive full router significantly improves over Ridge on NN5.
- The adaptive controller moves simple-model coverage closer to 70 percent than the
  static router.
- The full router is noninferior to the random-forest router under the preregistered
  1 percent margin.
unsupported_claims:
- The proposed method is the most accurate method on NN5.
- The proposed method outperforms LightGBM or equal-weight averaging on NN5.
- The proposed method satisfies the preregistered NN5 test coverage tolerance.
- Adaptive control improves NN5 test RMSSE over the static router.
required_reporting:
- Report rank 9 of 14 and the failed coverage constraint.
- Report both statistically favorable and unfavorable comparisons.
- Do not retune, rerun, or exclude NN5 after observing the formal test.
- Treat NN5 as one dataset; do not generalize until additional domains are completed.
